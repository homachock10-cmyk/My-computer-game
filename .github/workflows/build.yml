name: Build My Computer Game

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and package game
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -s index.html
          test -s game.js
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -q 'src="game.js"' index.html
          echo "Required game files are present."

      - name: Check JavaScript syntax
        run: node --check game.js

      - name: Package game
        run: |
          mkdir -p dist
          cp index.html game.js dist/
          test -s dist/index.html
          test -s dist/game.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-computer-game-build
          path: dist/
          if-no-files-found: error
